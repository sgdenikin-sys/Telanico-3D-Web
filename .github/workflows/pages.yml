name: Publish Telanico 3D Web

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'tools/verify_release.py'
      - 'tools/release-v22.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy public Godot web build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public web repository
        uses: actions/checkout@v4

      - name: Verify deployable website
        run: |
          test -s site/index.html
          python3 tools/verify_release.py
          echo "Deploying only the site/ directory"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
