name: Publish Telanico 3D Web

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'tools/verify_release.py'
      - 'tools/release-v22.json'
      - 'tools/verify_live.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy public Godot web build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public web repository
        uses: actions/checkout@v4

      - name: Verify deployable website
        run: |
          test -s site/index.html
          python3 tools/verify_release.py
          echo "Deploying only the site/ directory"

      - name: Stage isolated Settlements Hall review asset
        env:
          TELANICO_LAB_ARTIFACT_TOKEN: ${{ secrets.TELANICO_LAB_ARTIFACT_TOKEN }}
        run: python3 tools/stage_hall_preview.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install browser validation
        timeout-minutes: 4
        run: |
          python3 -m pip install --timeout 30 --retries 2 --only-binary=:all: playwright==1.58.0
          browser_bin=$(command -v google-chrome || command -v chromium)
          "$browser_bin" --version

      - name: Verify actual public runtime and desktop/mobile opening
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tools/verify_live.py "$LIVE_URL"

      - name: Save live validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-validation
          path: live-evidence/
          if-no-files-found: ignore
