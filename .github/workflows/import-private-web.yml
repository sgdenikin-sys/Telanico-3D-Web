name: Import tested 3D Web build
on:
  # Releases are initiated only by an explicit reviewed source-run pin.
  # Never automatically track the newest private branch or run on a schedule.
  push:
    branches: [main]
    paths: ['tools/preview-source.json']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful private Godot Web playable run ID (optional release-pin override)'
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test importer failure safety
        run: python3 tools/test_import_preview.py
      - name: Import newest tested allowlisted V2 candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.TELANICO_LAB_ARTIFACT_TOKEN }}
          TELANICO_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python3 tools/import_preview.py
      - name: Commit verified public runtime snapshot
        if: steps.candidate.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          git commit -m 'Publish tested Telanico V2 ${{ steps.candidate.outputs.commit }}'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        if: steps.candidate.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.candidate.outputs.changed == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.candidate.outputs.changed == 'true'
      - name: Verify actual HTTPS build and WebGL runtime
        if: steps.candidate.outputs.changed == 'true'
        env:
          EXPECTED_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import json,os,time,urllib.request,urllib.error
          from playwright.sync_api import sync_playwright
          url='https://sgdenikin-sys.github.io/Telanico-3D-Web/'
          expected=os.environ['EXPECTED_COMMIT']
          for attempt in range(12):
              try:meta=json.load(urllib.request.urlopen(url+'build.json?verify='+expected))
              except (urllib.error.URLError, json.JSONDecodeError):meta={}
              if meta.get('commit')==expected:break
              time.sleep(5)
          assert meta['commit']==expected and meta.get('camera_elevation_above_horizontal')==40 and meta.get('camera_projection')=='orthographic',meta
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader'])
              for width,height in [(1440,900),(844,390)]:
                  page=browser.new_page(viewport={'width':width,'height':height},has_touch=width==844)
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto(url+'?test=1&build='+expected,wait_until='domcontentloaded')
                  page.wait_for_function('window.__TELANICO_STATE?.ready',polling=500,timeout=120000)
                  state=page.evaluate('window.__TELANICO_STATE')
                  assert state['commit']==expected and len(state['sites'])==15,state
                  assert state['elevation']==40 and state['projection']==1,state
                  assert not errors,errors
                  page.close()
              browser.close()
          print('LIVE_HTTPS_WEBGL_VERIFIED',expected,url)
          PY
