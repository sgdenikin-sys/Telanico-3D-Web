name: Verify and release Telanico V2.2 (public runner, private source)
on:
  push:
    branches: [main]
    paths:
      - 'tools/v22-release-source.json'
      - '.github/workflows/v22-verified-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telanico-verified-v22-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout public release repository
        uses: actions/checkout@v4
      - name: Validate exact private release pin
        id: pin
        run: |
          python3 - <<'PY'
          import json,os,re
          data=json.load(open('tools/v22-release-source.json'))
          assert data['branch']=='codex/telanico-v2-2-story-integration', data
          assert re.fullmatch('[0-9a-f]{40}',data['commit']),data
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('sha='+data['commit']+'\n')
          PY
      - name: Checkout pinned PRIVATE game sources (never publish source)
        uses: actions/checkout@v4
        with:
          repository: sgdenikin-sys/Telanico-3D-Lab
          ref: ${{ steps.pin.outputs.sha }}
          token: ${{ secrets.TELANICO_LAB_ARTIFACT_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Confirm precise private source SHA
        env:
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          test "$(git -C private-src rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f private-src/godot/scripts/story/story_game.gd
          test -f private-src/tools/test_story_browser.py
      - name: Install Blender and required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy ripgrep
          blender --background --python-exit-code 1 --python-expr "import numpy; print(numpy.__version__)"
      - name: Install matching Godot editor and web templates
        shell: bash
        env:
          GODOT_VERSION: '4.6.3'
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" 'templates/web_nothreads_release.zip' -d "$template_dir"
      - name: Build, unit-test and export pinned Godot game
        working-directory: private-src
        env:
          BUILD_SOURCE_SHA: ${{ steps.pin.outputs.sha }}
          BUILD_SOURCE_BRANCH: codex/telanico-v2-2-story-integration
          GODOT_VERSION: '4.6.3'
        run: bash tools/build_web.sh
      - name: Install real browser testing
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Test WebGL and approved desktop/iPhone camera behavior
        working-directory: private-src
        timeout-minutes: 20
        run: python3 tools/test_v2_browser.py build/web --release-cases
      - name: Test complete iPhone story, office controls and victory
        working-directory: private-src
        timeout-minutes: 30
        run: python3 tools/test_story_browser.py build/web
      - name: Validate public runtime allowlist and source provenance
        env:
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shutil
          p=pathlib.Path('private-src/build/web')
          meta=json.loads((p/'build.json').read_text())
          assert meta['version']=='telanico-v2.2',meta
          assert meta['commit']==os.environ['EXPECTED_SHA'],meta
          assert meta['branch']=='codex/telanico-v2-2-story-integration',meta
          media={'media/'+x for x in [
              'music.mp3','cooper_chponk.wav','door_open_office.wav',
              'tube_water_flush.wav','bird_takeoff_soft_purr.wav',
              'door_close_soft.wav','select_woosh.wav','menu_flip.wav',
              'door_open_playful.wav','swallow_takeoff.wav'
          ]}
          allowed={'audio_bridge.js','index.html','index.js','index.wasm',
              'index.pck','index.audio.worklet.js','index.audio.position.worklet.js',
              'index.icon.png','index.apple-touch-icon.png','index.png',
              'LICENSES.html','build.json'}|media
          actual={str(x.relative_to(p)) for x in p.rglob('*') if x.is_file()}
          assert actual<=allowed,('Unapproved public files',sorted(actual-allowed))
          required={'index.html','index.js','index.wasm','index.pck','audio_bridge.js','build.json','LICENSES.html'}|media
          assert required<=actual,('Missing files',sorted(required-actual))
          assert (p/'index.wasm').read_bytes()[:8]==bytes.fromhex('0061736d01000000')
          assert (p/'index.pck').read_bytes()[:4]==b'GDPC'
          assert os.environ['EXPECTED_SHA'] in (p/'index.html').read_text()
          print('V22_RELEASE_GATE_PASS',meta['commit'])
          site=pathlib.Path('site')
          shutil.rmtree(site)
          shutil.copytree(p,site)
          (site/'.nojekyll').touch()
          PY
      - name: Commit only validated Web artifacts to public site
        env:
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          git diff --cached --quiet && exit 0
          git commit -m "Publish fully tested Telanico V2.2 $EXPECTED_SHA"
          git push origin HEAD:main
